# SonarQube Configuration for PowerWarden (Flutter + Android Kotlin)
sonar.projectKey=mrun1corn_power-warden
sonar.projectName=PowerWarden
sonar.projectVersion=1.0.0

# SonarCloud
sonar.host.url=https://sonarcloud.io
sonar.organization=mrun1corn

# Source & Test paths
sonar.sources=lib,android/app/src/main/kotlin
sonar.tests=test

# Encoding
sonar.sourceEncoding=UTF-8

# Flutter Test Coverage
sonar.coverage.lcov.reportPaths=coverage/lcov.info

# Code exclusions
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,android/app/src/main/res/**,build/**,.dart_tool/**
sonar.test.inclusions=test/**
