name: PowerWarden CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Dart Analyze
        run: dart analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Generate Test Coverage
        run: flutter test --coverage

      - name: Install Sonar Scanner
        run: |
          curl -sSL -o sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip"
          unzip -q sonar-scanner.zip
          echo "$PWD/sonar-scanner-6.1.0.4477-linux-x64/bin" >> "$GITHUB_PATH"

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=mrun1corn_power-warden \
            -Dsonar.projectName=PowerWarden \
            -Dsonar.projectVersion=1.0.0 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=mrun1corn \
            -Dsonar.sources=lib,android/app/src/main/kotlin \
            -Dsonar.tests=test \
            -Dsonar.coverage.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,android/app/src/main/res/**,build/**,.dart_tool/**

      - name: Build Android Release Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: power-warden-apks
          path: build/app/outputs/flutter-apk/*.apk
